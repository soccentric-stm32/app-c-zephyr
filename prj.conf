# prj.conf - ZDEMO Kconfig
# Author: Sandesh Ghimire <sandesh@soccentric.com>
# SRS:    SRS-ZEPHYR-F767

# ZBT-001: run from the bootloader slot at 0x0800C000, 976 KB.
CONFIG_USE_DT_CODE_PARTITION=n
CONFIG_FLASH_LOAD_OFFSET=0xC000
CONFIG_FLASH_LOAD_SIZE=0xF4000

# ZRT-002: k_event is used for health check-ins.
CONFIG_EVENTS=y

# ZRT-003: 1 kHz kernel tick.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# ZGEN-003: caches on, as in the C demo.
CONFIG_CACHE_MANAGEMENT=y
CONFIG_ICACHE=y
CONFIG_DCACHE=y

# ZRT-006 / ZSAFE-004: MPU stack guards and assertions.
CONFIG_HW_STACK_PROTECTION=y
CONFIG_ASSERT=y

# ZGEN-006: no warnings.
CONFIG_COMPILER_WARNINGS_AS_ERRORS=y

# LEDs, button and USART3.
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y

# ZCON-005: USART3 carries HWLINK only, so no console, shell or log output.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n

# ZGEN-004: fatal errors reset the board.
CONFIG_REBOOT=y

# ZGEN-005: reset cause through hwinfo.
CONFIG_HWINFO=y

# ZBT-006 / ZFN-004: Zephyr flash API for the CONFIRMED record.
CONFIG_FLASH=y

# ZRT-004 / ZFN-004: IWDG through the watchdog API.
CONFIG_WATCHDOG=y

# ZLNK-002: Zephyr CRC32-ISO-HDLC.
CONFIG_CRC=y

# ZRT-005: high-water marks for Status.
CONFIG_THREAD_MONITOR=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_NAME=y

# Heap statistics for Status (the application itself does not allocate).
CONFIG_SYS_HEAP_RUNTIME_STATS=y

# Keep the main thread small; all work is in the static application threads.
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_BOOT_BANNER=n
